name: AI-Nexus Production CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: Backend CI & Regression Testing
  # ==========================================
  backend-ci:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Regression Test Suite
        working-directory: ./backend
        env:
          SPRING_PROFILES_ACTIVE: test
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          JWT_SECRET: "test-secret-signing-key-minimum-32-chars-long"
        run: mvn clean test -B

      - name: Build Backend Production Jar
        working-directory: ./backend
        run: mvn package -DskipTests -B

  # ==========================================
  # JOB 2: Frontend CI & Build
  # ==========================================
  frontend-ci:
    name: Frontend Build & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: npm run build

  # ==========================================
  # JOB 3: AI Microservice CI
  # ==========================================
  ai-service-ci:
    name: AI Service Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ./ai-service/requirements.txt

      - name: Install AI Service Dependencies
        working-directory: ./ai-service
        run: pip install -r requirements.txt

      - name: Validate Python Syntax & Imports
        working-directory: ./ai-service
        run: python -m py_compile app/main.py

  # ==========================================
  # JOB 4: Docker Container Validation
  # ==========================================
  docker-validation:
    name: Container Build Verification
    needs: [backend-ci, frontend-ci, ai-service-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false

      - name: Build AI Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: false
