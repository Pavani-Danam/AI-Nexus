spring.application.name=ai-nexus-backend

server.port=8080

# Database Configuration (In-Memory H2 in PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:ainexus_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & JWT Configuration
jwt.secret=dGhpcy1pcy1hLXNlY3VyZS1kZXZlbG9wbWVudC1zaWduaW5nLWtleS1mb3ItYWktbmV4dXM=
jwt.expiration=86400000
ainexus.jwt.secret=dGhpcy1pcy1hLXNlY3VyZS1kZXZlbG9wbWVudC1zaWduaW5nLWtleS1mb3ItYWktbmV4dXM=
ainexus.jwt.expiration-ms=86400000

# AI & Vector Limits / API Keys
gemini.api.key=test-gemini-key
pinecone.api.key=test-pinecone-key
pinecone.environment=us-east-1
pinecone.index.name=ainexus-index

ainexus.agent.max-planning-steps=8
ainexus.agent.max-replanning-attempts=2
ainexus.gemini.api-key=test-gemini-key
ainexus.pinecone.api-key=test-pinecone-key
ainexus.pinecone.index-name=ainexus-index
ainexus.pinecone.environment=us-east-1

logging.level.com.ainexus=INFO
