spring.application.name=ai-nexus-backend
server.port=8080

# MySQL DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ai_nexus_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Pavani@3001
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Temporary exclusion of Security auto-configuration only
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# JWT Security Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-seconds=3600
jwt.refresh-expiration-seconds=604800

# Document Storage Configuration
app.storage.documents-dir=uploads/documents

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Document Chunking Configuration
app.rag.chunk-size=500
app.rag.chunk-overlap=100

# Gemini AI & Embedding Configuration
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:text-embedding-004}
app.ai.embedding.provider=${APP_AI_EMBEDDING_PROVIDER:gemini}
app.ai.embedding.timeout-seconds=15

# Pinecone Vector Database Configuration
app.ai.pinecone.api-key=${PINECONE_API_KEY:}
app.ai.pinecone.index-name=${PINECONE_INDEX_NAME:ai-nexus-index}
app.ai.pinecone.host=${PINECONE_HOST:}
app.ai.pinecone.dimension=768
app.ai.pinecone.metric=cosine
app.ai.pinecone.default-top-k=5
app.ai.pinecone.timeout-seconds=15

# Semantic Search Configuration
app.search.default-top-k=5
app.search.max-top-k=20
app.search.min-score=0.0
app.search.max-query-length=1000

# RAG Retrieval & Context Assembly Configuration
app.rag.top-k=5
app.rag.min-relevance-score=0.35
app.rag.max-context-characters=8000
