# ===================================================================
# AI-NEXUS PRODUCTION PROFILE CONFIGURATION
# ===================================================================

spring.application.name=ai-nexus

# --- Database & Hikari Connection Pool ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ainexus_prod}
spring.datasource.username=${DB_USERNAME:ainexus_admin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- File Upload Storage ---
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:30MB}
app.storage.upload-dir=${UPLOAD_DIR:/var/ainexus/uploads}

# --- JWT Configuration ---
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Gemini API Configuration ---
app.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.generation-model=${GEMINI_MODEL:gemini-1.5-flash}
app.ai.gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:text-embedding-004}
app.ai.gemini.temperature=${GEMINI_TEMPERATURE:0.2}
app.ai.gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:2048}
app.ai.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:30}

# --- Pinecone Vector Database ---
app.pinecone.api-key=${PINECONE_API_KEY:}
app.pinecone.environment=${PINECONE_ENVIRONMENT:us-east-1}
app.pinecone.index-name=${PINECONE_INDEX:ainexus-index}
app.pinecone.timeout-seconds=${PINECONE_TIMEOUT_SECONDS:20}

# --- RAG & Context Configuration ---
app.rag.max-context-characters=${RAG_MAX_CONTEXT_CHARS:8000}
app.rag.similarity-threshold=${RAG_SIMILARITY_THRESHOLD:0.70}
app.rag.top-k=${RAG_TOP_K:5}

# --- Autonomous Agent & Workflow Limits ---
app.agent.max-iterations=${AGENT_MAX_ITERATIONS:10}
app.agent.max-planning-steps=${AGENT_MAX_STEPS:8}
app.agent.max-replanning-attempts=${AGENT_MAX_REPLANS:3}
app.agent.execution-timeout-seconds=${AGENT_TIMEOUT_SECONDS:120}

app.workflow.max-concurrency=${WORKFLOW_MAX_CONCURRENCY:10}
app.workflow.retry-limit=${WORKFLOW_RETRY_LIMIT:3}
app.workflow.retry-delay-ms=${WORKFLOW_RETRY_DELAY_MS:2000}

# --- CORS Configuration ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://ainexus.app,https://admin.ainexus.app}

# --- Production Logging ---
logging.level.root=WARN
logging.level.com.ainexus=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=ERROR
